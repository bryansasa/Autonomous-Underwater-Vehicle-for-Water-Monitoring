tyrant_plant_sim:
  ros__parameters:
    update_rate_hz: 50.0

    # Initial reduced state. This simulator is synthetic and is not a
    # substitute for vehicle SysID or hydrodynamic validation.
    initial_depth_m: 0.0
    initial_roll_rad: 0.0
    initial_pitch_rad: 0.0
    initial_yaw_rad: 0.0

    # Normalized-wrench -> reduced dynamics development coefficients.
    heave_accel_per_z: 0.80
    heave_damping_per_s: 1.20

    roll_accel_per_k: 1.50
    roll_damping_per_s: 1.50
    roll_restoring_per_s2: 0.70

    pitch_accel_per_m: 1.50
    pitch_damping_per_s: 1.50
    pitch_restoring_per_s2: 0.70

    yaw_accel_per_n: 1.00
    yaw_damping_per_s: 1.20

    # Saturation keeps pathological test commands bounded.
    max_depth_m: 20.0
    max_angular_rate_rad_s: 2.0
