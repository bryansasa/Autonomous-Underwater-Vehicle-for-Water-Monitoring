[env:teensy41]
platform = teensy@4.18.0
board = teensy41
framework = arduino

board_microros_distro = humble
board_microros_transport = serial
board_microros_user_meta = tyrant_microros.meta

monitor_speed = 115200

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    https://github.com/bluerobotics/BlueRobotics_MS5837_Library.git

build_src_filter =
    +<*>
    -<smoke/*>

[env:teensy41-debug]
extends = env:teensy41
build_flags =
    -DTYRANT_ENABLE_DIAGNOSTICS

# ============================================================
# END-TO-END MOCK THRUSTER STACK
#
# Uses explicit synthetic geometry and the mock backend only.
# No PWM/ESC output exists in this profile. Never treat this
# geometry as vehicle geometry.
# ============================================================
[env:teensy41-mock-thrusters]
extends = env:teensy41
build_flags =
    -DTYRANT_USE_SYNTHETIC_THRUSTER_GEOMETRY
    -DTYRANT_USE_MOCK_THRUSTER_BACKEND


# ============================================================
# HARDWARE-IN-THE-LOOP (HIL) REDUCED PLANT SIMULATION
#
# Uses synthetic geometry, mock thrusters, and ROS-injected reduced
# state. Physical sensors and PWM are not required. Never use this
# profile as production vehicle firmware.
# ============================================================
[env:teensy41-hil]
extends = env:teensy41
build_flags =
    -DTYRANT_USE_SYNTHETIC_THRUSTER_GEOMETRY
    -DTYRANT_USE_MOCK_THRUSTER_BACKEND
    -DTYRANT_USE_SIM_STATE_INPUT

# ============================================================
# CORE UNIT / REGRESSION TESTS
#
# Reuses the proven non-EKF tests from tyrant-auv and adds
# tests for the reduced estimator, safety, mode, scheduler,
# and depth-reference policy.
# ============================================================
[env:teensy41-test]
extends = env:teensy41

test_build_src = yes
test_ignore =
    test_connection_manager

build_flags =
    -DUNITY_SUPPORT_64
    -DTYRANT_USE_MOCK_THRUSTER_BACKEND

build_src_filter =
    -<*>
    +<estimation/simple_state_estimator.cpp>
    +<sensors/depth_estimator.cpp>
    +<sensors/imu_mounting.cpp>
    +<sensors/sensor_manager.cpp>
    +<safety/safety_manager.cpp>
    +<vehicle/vehicle_mode.cpp>
    +<scheduler/scheduler.cpp>
    +<application/depth_reference_manager.cpp>
    +<application/mission_manager.cpp>
    +<application/emergency_recovery_manager.cpp>
    +<control/manual_command_manager.cpp>
    +<control/manual_wrench_mapper.cpp>
    +<control/stabilized_manual_controller.cpp>
    +<control/thruster_allocation.cpp>
    +<control/thruster_allocator.cpp>
    +<actuation/mock_thruster_backend.cpp>
    +<actuation/thruster_output_mapper.cpp>
    +<actuation/pwm_thruster_backend.cpp>
    +<actuation/thruster_backend.cpp>
    +<sysid/sysid_recorder.cpp>
    +<simulation/sim_state_source.cpp>

# ============================================================
# CONNECTION MANAGER TEST
#
# Kept separate so the test can provide tiny TyrantROS stubs
# instead of linking the full micro-ROS implementation.
# ============================================================
[env:teensy41-test-connection]
extends = env:teensy41

test_build_src = yes
test_filter =
    test_connection_manager

build_flags =
    -DUNITY_SUPPORT_64

build_src_filter =
    -<*>
    +<communication/connection_manager.cpp>
    +<safety/safety_manager.cpp>
    +<vehicle/vehicle_mode.cpp>

[env:teensy41-hwt905-smoke]
extends = env:teensy41
build_src_filter =
    -<*>
    +<smoke/hwt905_uart_smoke.cpp>
monitor_speed = 115200

[env:teensy41-fulldepth-smoke]
extends = env:teensy41
build_src_filter =
    -<*>
    +<smoke/fulldepth_i2c_smoke.cpp>
monitor_speed = 115200

# ============================================================
# PWM BACKEND COMPILE CHECK
#
# Physical code is compiled, but development pin configuration is
# deliberately 0xFF/unconfigured, so init fails closed and no Servo
# channel is attached. Do not use as a vehicle firmware until actual
# pins, neutral/deadzone, and thrust direction are verified.
# ============================================================
[env:teensy41-pwm-skeleton]
extends = env:teensy41
build_flags =
    -DTYRANT_ENABLE_PHYSICAL_THRUSTER_OUTPUT
