[platformio]
; Keep all downloaded tools/build state inside esp, separate from Teensy.
core_dir = .pio-core

[env:esp32-s3-devkitm-1]
platform = espressif32@6.12.0
board = esp32-s3-devkitm-1
framework = arduino
board_microros_distro = humble
board_microros_transport = serial
board_microros_user_meta = payload_microros.meta
monitor_speed = 115200
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++14
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

# Synthetic payload only, isolated topic namespace /tyrant/payload_sim.
[env:esp32-s3-sim]
extends = env:esp32-s3-devkitm-1
build_flags =
    ${env:esp32-s3-devkitm-1.build_flags}
    -D PAYLOAD_SIMULATION
